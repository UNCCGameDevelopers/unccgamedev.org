# Redirect-only site for unccgamedev.org and its forwarding subdomains.
# Rules live in public/_redirects. No build step.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
