name: Check redirects

on:
  pull_request:
    paths: ["public/_redirects", "netlify.toml", "scripts/**", "test/**", ".github/workflows/check-redirects.yml"]
  push:
    branches: [main]
    paths: ["public/_redirects", "netlify.toml", "scripts/**", "test/**", ".github/workflows/check-redirects.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock @netlify/redirect-parser@16.1.1
      - run: node --test test/*.test.mjs
      - run: node scripts/check-redirects.mjs public/_redirects
