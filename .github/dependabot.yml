# Keeps the SHA-pinned GitHub Actions in .github/workflows up to date (weekly PRs).
# There's no package.json: @netlify/redirect-parser is pinned in the workflows and
# updated by hand (exact version at least 2 weeks old).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
